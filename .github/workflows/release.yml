name: release

# Build the standalone executables and attach them to a GitHub Release.
# Triggered by pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`),
# or manually from the Actions tab to smoke-test the build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: autoticker-bot-linux-x86_64
            binary: autoticker-bot
          - os: windows-latest
            asset: autoticker-bot-windows-x86_64
            binary: autoticker-bot.exe
          - os: macos-latest
            asset: autoticker-bot-macos-arm64
            binary: autoticker-bot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      # Fail early if the code is broken, before spending time on packaging.
      - run: pytest -q

      - run: pyinstaller packaging/autoticker.spec --clean --noconfirm

      # Confirm the executable actually starts. --version exits immediately and
      # touches no network or config, so it is a safe smoke test.
      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          "dist/${{ matrix.binary }}" --version
          "dist/${{ matrix.binary }}" --help > /dev/null

      # Windows ships as a bare .exe: nothing to unpack, just download and run.
      # The AGPL text travels inside the executable instead of beside it (see
      # `--license`), so no sidecar files are needed.
      - name: Name the bare executable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp "dist/${{ matrix.binary }}" "${{ matrix.asset }}.exe"

      # macOS and Linux stay archived: a bare binary downloaded through a
      # browser loses its executable permission bit, forcing users to chmod +x,
      # while tar preserves the mode. The archive also carries LICENSE and the
      # quick-start guide.
      - name: Stage release archive (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staging/${{ matrix.asset }}"
          cp "dist/${{ matrix.binary }}" "staging/${{ matrix.asset }}/"
          cp LICENSE "staging/${{ matrix.asset }}/"
          cp docs/BINARY.md "staging/${{ matrix.asset }}/README.md"
          tar -czf "${{ matrix.asset }}.tar.gz" -C staging "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.exe
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    # Only publish a Release for an actual tag push, not a manual test run.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Checksums let users verify the download wasn't tampered with.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File | To run |
            | -------- | ---- | ------ |
            | Windows  | `autoticker-bot-windows-x86_64.exe` | Download and double-click — no unzipping |
            | macOS (Apple Silicon) | `autoticker-bot-macos-arm64.tar.gz` | Unpack, then run `./autoticker-bot` |
            | Linux    | `autoticker-bot-linux-x86_64.tar.gz` | Unpack, then run `./autoticker-bot` |

            The executable walks you through setup on first launch. See
            [docs/BINARY.md](docs/BINARY.md) for the full guide, including how to
            get past the "unknown developer" warning your OS will show (these
            builds are unsigned).

            The macOS and Linux downloads are archived so the executable
            permission bit survives; the Windows build needs no archive, and
            carries its license internally — run it with `--license`.

            Verify your download against `SHA256SUMS.txt`.

            Prefer a long-running install? [Docker](docs/DOCKER.md) restarts the
            bot automatically on crash and reboot.
